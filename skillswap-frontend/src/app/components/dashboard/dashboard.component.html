<div class="container mt-4" *ngIf="user; else loadingTpl">
  <h2 class="fw-bold text-center mb-4">Welcome, {{ user.name }}!</h2>
  <p class="text-center text-muted">
    You are logged in as <strong>{{ user.role }}</strong><br />
    <small>Email: {{ user.email }}</small>
  </p>

  <!-- Role-based dashboards -->
  <app-student-dashboard *ngIf="user.role === 'STUDENT'"></app-student-dashboard>
  <app-teacher-dashboard *ngIf="user.role === 'TEACHER'"></app-teacher-dashboard>

  <div class="text-center mt-5">
    <button class="btn btn-outline-danger px-4" (click)="logout()">Logout</button>
  </div>
</div>

<ng-template #loadingTpl>
  <p class="text-center mt-5 text-muted">Loading dashboard...</p>
</ng-template>
